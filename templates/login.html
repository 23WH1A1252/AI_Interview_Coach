<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | AI Driven Interview Coach</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --primary: #6c63ff; --neon-cyan: #00f2ff; --bg: #0f0f1b; --card-bg: #1a1a2e; }
        body { background: var(--bg); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .auth-card { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); width: 420px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        .brand-header { display: flex; justify-content: center; gap: 8px; font-size: 1.7em; font-weight: 800; margin-bottom: 30px; white-space: nowrap; }
        .brand-ai { color: white; }
        .brand-coach { color: var(--primary); }
        label { display: block; text-align: left; color: #a0a0c0; font-weight: 600; margin-top: 15px; }
        .password-wrapper { position: relative; width: 100%; display: flex; align-items: center; margin-top: 8px; }
        input { width: 100%; padding: 14px; border: 1px solid #333; border-radius: 12px; background: #000; color: white; font-size: 1em; outline: none; }
        .toggle-btn { position: absolute; right: 15px; background: none; border: none; cursor: pointer; color: var(--neon-cyan); display: flex; align-items: center; }
        .btn { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 1.1em; margin-top: 30px; }
        .footer-text { color: #a0a0c0; margin-top: 25px; display: block; }
        .footer-text a { color: var(--neon-cyan); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand-header">
            <span class="brand-ai">AI Driven</span> <span class="brand-coach">Interview Coach</span>
        </div>
        
        <form action="/login" method="POST">
            <label>Username</label>
            <input type="text" name="username" placeholder="Username" required>
            
            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" name="password" id="loginPass" placeholder="••••••••" required>
                <button type="button" class="toggle-btn" id="toggleLogin">
                    <i id="loginIcon" data-lucide="eye"></i>
                </button>
            </div>
            
            <button type="submit" class="btn">Login to Dashboard</button>
        </form>
        <span class="footer-text">New here? <a href="/register">Register here</a></span>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('toggleLogin').addEventListener('click', function() {
            const passInput = document.getElementById('loginPass');
            const icon = document.getElementById('loginIcon');
            
            const isPass = passInput.getAttribute('type') === 'password';
            passInput.setAttribute('type', isPass ? 'text' : 'password');
            icon.setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
            
            lucide.createIcons();
        });
    </script>
</body>
</html>
